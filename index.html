<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Siswa – SMK Bina Insan Mandiri</title>
<style>
  :root {
    --bg: #f3f5fb; --card: #ffffff; --text: #1d2433; --muted: #6b7489;
    --border: #d9deea; --primary: #2f5bea; --primary-dark: #2448c4;
    --error-bg: #fdecec; --error: #b42318; --ok-bg: #e7f6ee; --ok: #157347;
    --shadow: 0 10px 30px rgba(30, 45, 90, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420; --card: #1a2133; --text: #e8ecf6; --muted: #9aa5bf;
      --border: #2d3752; --primary: #5b82ff; --primary-dark: #4a6fe8;
      --error-bg: #3a1a1a; --error: #ff9b94; --ok-bg: #13301f; --ok: #7be0a6;
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--card); border-radius: 16px;
    box-shadow: var(--shadow); padding: 32px 28px;
  }
  .brand { text-align: center; margin-bottom: 24px; }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px;
    background: var(--primary); color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 20px; letter-spacing: 1px;
  }
  h1 { margin: 0; font-size: 22px; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  .field { position: relative; }
  input {
    width: 100%; padding: 12px 14px; font-size: 16px; color: var(--text);
    background: transparent; border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47, 91, 234, .2); }
  .field input[type="password"], .field input.pw-visible { padding-right: 64px; }
  .toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--primary); font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 6px 8px;
  }
  .btn {
    width: 100%; margin-top: 22px; padding: 12px; font-size: 16px; font-weight: 600;
    color: #fff; background: var(--primary); border: 0; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.info { background: var(--bg); color: var(--muted); }
  .scanner { display: none; margin-top: 18px; }
  .scanner.show { display: block; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 15px; }
  .row .btn { width: auto; margin: 0; padding: 10px 16px; font-size: 15px; }
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 24px; text-align: left; }
  .list-head h2 { margin: 0; font-size: 16px; }
  .link-btn { background: none; border: 0; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; }
  .count { text-align: left; margin: 4px 0 8px; font-size: 13px; color: var(--muted); }
  .hadir-list {
    list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 10px; text-align: left;
  }
  .hadir-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .hadir-list li:last-child { border-bottom: 0; }
  .hadir-list .meta { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; }
  .hadir-list .empty { color: var(--muted); justify-content: center; }
  .video-wrap {
    position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden;
    border-radius: 14px; background: #000;
  }
  .video-wrap video { width: 100%; height: 100%; object-fit: cover; }
  .video-wrap .frame {
    position: absolute; inset: 18%; border: 3px solid rgba(255,255,255,.9);
    border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none;
  }
  .btn.secondary { background: transparent; color: var(--primary); border: 1px solid var(--border); }
  .msg { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .msg.show { display: block; }
  .msg.error { background: var(--error-bg); color: var(--error); }
  .welcome { display: none; text-align: center; }
  .welcome.show { display: block; }
  .welcome .badge {
    display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px;
    background: var(--ok-bg); color: var(--ok); font-size: 13px; font-weight: 600;
  }
  footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">BIM</div>
      <h1>Login Siswa</h1>
      <p class="sub">SMK Bina Insan Mandiri</p>
    </div>

    <form id="loginForm" autocomplete="off" novalidate>
      <label for="nis">NIS</label>
      <input id="nis" name="nis" type="text" inputmode="numeric" placeholder="Masukkan NIS" required>

      <label for="password">Password</label>
      <div class="field">
        <input id="password" name="password" type="password" placeholder="Masukkan password" required>
        <button type="button" class="toggle" id="toggle" aria-label="Tampilkan password">Lihat</button>
      </div>

      <div id="error" class="msg error" role="alert"></div>
      <button type="submit" class="btn">Masuk</button>
    </form>

    <section id="welcome" class="welcome">
      <h1 id="welcomeName"></h1>
      <span class="badge" id="welcomeClass"></span>
      <p class="sub" style="margin-top:14px">Login berhasil.</p>

      <button type="button" class="btn" id="scanBtn">Scan QR Hadir</button>
      <div id="scanner" class="scanner">
        <div class="video-wrap">
          <video id="video" playsinline muted></video>
          <div class="frame"></div>
        </div>
        <p class="sub" id="scanStatus">Arahkan kamera ke QR code kehadiran.</p>
        <button type="button" class="btn secondary" id="closeScan">Tutup kamera</button>
      </div>
      <div id="scanResult" class="msg" role="status"></div>


      <div class="list-head">
        <h2 id="listTitle">Hadir hari ini</h2>
        <button type="button" class="link-btn" id="refreshList">Muat ulang</button>
      </div>
      <p class="count" id="listCount"></p>
      <ol class="hadir-list" id="hadirList"></ol>

      <button type="button" class="btn secondary" id="logout">Keluar</button>
    </section>

    <footer>&copy; SMK Bina Insan Mandiri</footer>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
  // Konfigurasi Supabase (anon key memang boleh ada di sisi klien)
  const SUPABASE_URL = "https://tldolhztnufvgbanigba.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsZG9saHp0bnVmdmdiYW5pZ2JhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NTc4NTksImV4cCI6MjEwODEzMzg1OX0.7nPP7tV8bhLZzlMcaSFrXWuyq4n72kTDSwcEyhc55LU";

  const form = document.getElementById("loginForm");
  const nisInput = document.getElementById("nis");
  const pwInput = document.getElementById("password");
  const errorBox = document.getElementById("error");
  const welcome = document.getElementById("welcome");
  const submitBtn = form.querySelector(".btn");
  let currentUser = null; // { nis, password } selama sesi login

  function showError(text) {
    errorBox.textContent = text;
    errorBox.classList.add("show");
  }

  document.getElementById("toggle").addEventListener("click", function () {
    const hidden = pwInput.type === "password";
    pwInput.type = hidden ? "text" : "password";
    pwInput.classList.toggle("pw-visible", hidden);
    this.textContent = hidden ? "Sembunyi" : "Lihat";
  });

  async function loginSiswa(nis, password) {
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/login_siswa", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },
      body: JSON.stringify({ p_nis: nis, p_password: password })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    return rows.length ? rows[0] : null;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorBox.classList.remove("show");

    const nis = nisInput.value.trim();
    const pw = pwInput.value;
    if (!nis || !pw) { showError("NIS dan password wajib diisi."); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Memeriksa...";
    try {
      const siswa = await loginSiswa(nis, pw);
      if (!siswa) { showError("NIS atau password salah."); return; }

      currentUser = { nis: siswa.nis, password: pw };
      document.getElementById("welcomeName").textContent = "Selamat datang, " + siswa.nama + "!";
      document.getElementById("welcomeClass").textContent = siswa.kelas ? "Kelas " + siswa.kelas : "NIS " + siswa.nis;
      form.style.display = "none";
      document.querySelector(".brand").style.display = "none";
      welcome.classList.add("show");
      loadDaftar();

      // Untuk mengarahkan ke halaman lain setelah login, aktifkan baris ini:
      // window.location.href = "dashboard.html";
    } catch (err) {
      console.error(err);
      showError("Tidak dapat terhubung ke server. Coba lagi nanti.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Masuk";
    }
  });

  document.getElementById("logout").addEventListener("click", function () {
    stopScan();
    currentUser = null;
    scanResult.className = "msg";
    document.getElementById("hadirList").textContent = "";
    document.getElementById("listCount").textContent = "";
    welcome.classList.remove("show");
    form.style.display = "";
    document.querySelector(".brand").style.display = "";
    form.reset();
    nisInput.focus();
  });

  // ===== Scan QR Hadir =====
  const scanBtn = document.getElementById("scanBtn");
  const scanner = document.getElementById("scanner");
  const scanStatus = document.getElementById("scanStatus");
  const scanResult = document.getElementById("scanResult");
  const video = document.getElementById("video");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const hasNative = "BarcodeDetector" in window;
  let detector = null;
  let stream = null;
  let scanning = false;
  let busy = false;

  function showResult(type, text) {
    scanResult.textContent = text;
    scanResult.className = "msg show " + type;
  }

  async function rpc(name, body) {
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  }

  async function startScan() {
    scanResult.className = "msg";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showResult("error", "Kamera tidak tersedia. Buka halaman lewat HTTPS atau localhost.");
      return;
    }
    if (!hasNative && typeof jsQR === "undefined") {
      showResult("error", "Library pemindai gagal dimuat (cek koneksi internet).");
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (err) {
      showResult("error", "Kamera tidak bisa dibuka. Pastikan izin kamera diberikan.");
      return;
    }
    // Tampilkan area video DULU, baru diputar (video yang tersembunyi bisa tidak menghasilkan frame)
    scanBtn.style.display = "none";
    scanner.classList.add("show");
    scanStatus.textContent = "Memindai... arahkan kamera ke QR code.";
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* diabaikan, autoplay tetap jalan */ }
    if (hasNative && !detector) {
      try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { detector = null; }
    }
    scanning = true;
    busy = false;
    requestAnimationFrame(tick);
  }

  function stopScan() {
    scanning = false;
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    video.srcObject = null;
    scanner.classList.remove("show");
    scanBtn.style.display = "";
  }

  async function readFrame() {
    if (detector) {
      const found = await detector.detect(video);
      if (found.length && found[0].rawValue) return found[0].rawValue.trim();
      return null;
    }
    if (typeof jsQR === "undefined") return null;
    const scale = Math.min(1, 1000 / video.videoWidth);
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
    return code && code.data ? code.data.trim() : null;
  }

  async function tick() {
    if (!scanning) return;
    if (!busy && video.readyState >= 2 && video.videoWidth) {
      busy = true;
      try {
        const kode = await readFrame();
        if (kode && scanning) { handleCode(kode); return; }
      } catch (e) { /* frame gagal dibaca, coba lagi */ }
      busy = false;
    }
    requestAnimationFrame(tick);
  }

  async function handleCode(kode) {
    stopScan();
    if (kode.trim().toLowerCase() !== "hadir") {
      showResult("error", "QR code tidak valid. QR harus bertuliskan \"Hadir\".");
      return;
    }
    showResult("info", "Mencatat kehadiran...");
    try {
      const status = await rpc("catat_hadir", { p_nis: currentUser.nis, p_password: currentUser.password, p_kode: kode });
      if (status === "ok") showResult("ok", "Hadir berhasil dicatat. Terima kasih!");
      else if (status === "sudah") showResult("ok", "Kehadiran Anda hari ini sudah tercatat.");
      else if (status === "kode_salah") showResult("error", "QR code tidak valid.");
      else showResult("error", "Gagal mencatat kehadiran. Silakan login ulang.");
      loadDaftar();
    } catch (err) {
      console.error(err);
      showResult("error", "Tidak dapat terhubung ke server. Coba lagi.");
    }
  }

  // ===== Daftar hadir hari ini =====
  const listTitle = document.getElementById("listTitle");
  const listCount = document.getElementById("listCount");
  const hadirList = document.getElementById("hadirList");

  function renderList(rows) {
    hadirList.textContent = "";
    listCount.textContent = rows.length + " siswa hadir";
    if (!rows.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Belum ada yang hadir hari ini.";
      hadirList.appendChild(li);
      return;
    }
    rows.forEach(function (r) {
      const li = document.createElement("li");
      const nama = document.createElement("span");
      nama.textContent = r.nama;
      const meta = document.createElement("span");
      meta.className = "meta";
      const jam = new Date(r.waktu).toLocaleTimeString("id-ID", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit" });
      meta.textContent = (r.kelas ? r.kelas + " · " : "") + jam;
      li.appendChild(nama);
      li.appendChild(meta);
      hadirList.appendChild(li);
    });
  }

  async function loadDaftar() {
    if (!currentUser) return;
    listTitle.textContent = "Hadir hari ini, " + new Date().toLocaleDateString("id-ID", {
      timeZone: "Asia/Jakarta", weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    try {
      renderList(await rpc("daftar_hadir", { p_nis: currentUser.nis, p_password: currentUser.password }));
    } catch (err) {
      console.error(err);
      listCount.textContent = "Gagal memuat daftar hadir.";
    }
  }

  scanBtn.addEventListener("click", startScan);
  document.getElementById("closeScan").addEventListener("click", stopScan);
  document.getElementById("refreshList").addEventListener("click", loadDaftar);
</script>
</body>
</html>
