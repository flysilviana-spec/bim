<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Siswa – SMK Bina Insan Mandiri</title>
<meta name="theme-color" content="#2f5bea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5bea'/%3E%3Ctext x='32' y='41' font-size='24' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EBIM%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3f5fb; --card: #ffffff; --text: #1d2433; --muted: #6b7489;
    --border: #d9deea; --primary: #2f5bea; --primary-dark: #2448c4;
    --error-bg: #fdecec; --error: #b42318; --ok-bg: #e7f6ee; --ok: #157347;
    --shadow: 0 10px 30px rgba(30, 45, 90, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420; --card: #1a2133; --text: #e8ecf6; --muted: #9aa5bf;
      --border: #2d3752; --primary: #5b82ff; --primary-dark: #4a6fe8;
      --error-bg: #3a1a1a; --error: #ff9b94; --ok-bg: #13301f; --ok: #7be0a6;
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--card); border-radius: 16px;
    box-shadow: var(--shadow); padding: 32px 28px;
  }
  .brand { text-align: center; margin-bottom: 24px; }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px;
    background: var(--primary); color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 20px; letter-spacing: 1px;
  }
  h1 { margin: 0; font-size: 22px; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  .field { position: relative; }
  input {
    width: 100%; padding: 12px 14px; font-size: 16px; color: var(--text);
    background: transparent; border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47, 91, 234, .2); }
  .field input[type="password"], .field input.pw-visible { padding-right: 64px; }
  .toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--primary); font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 6px 8px;
  }
  .btn {
    width: 100%; margin-top: 22px; padding: 12px; font-size: 16px; font-weight: 600;
    color: #fff; background: var(--primary); border: 0; border-radius: 10px; cursor: pointer;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.info { background: var(--bg); color: var(--muted); }
  .scanner { display: none; margin-top: 18px; }
  .scanner.show { display: block; }
  details.manual { margin-top: 14px; text-align: left; font-size: 14px; color: var(--muted); }
  details.manual summary { cursor: pointer; text-align: center; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 15px; }
  .row .btn { width: auto; margin: 0; padding: 10px 16px; font-size: 15px; }
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 24px; text-align: left; }
  .list-head h2 { margin: 0; font-size: 16px; }
  .link-btn { background: none; border: 0; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; }
  .count { text-align: left; margin: 4px 0 8px; font-size: 13px; color: var(--muted); }
  .hadir-list {
    list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 10px; text-align: left;
  }
  .hadir-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .hadir-list li:last-child { border-bottom: 0; }
  .hadir-list .meta { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; }
  .hadir-list .empty { color: var(--muted); justify-content: center; }
  .video-wrap {
    position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden;
    border-radius: 14px; background: #000;
  }
  .video-wrap video { width: 100%; height: 100%; object-fit: cover; }
  .video-wrap .frame {
    position: absolute; inset: 18%; border: 3px solid rgba(255,255,255,.9);
    border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none;
  }
  .btn.secondary { background: transparent; color: var(--primary); border: 1px solid var(--border); }
  .msg { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .msg.show { display: block; }
  .msg.error { background: var(--error-bg); color: var(--error); }
  .welcome { display: none; text-align: center; }
  .welcome.show { display: block; }
  .welcome .badge {
    display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px;
    background: var(--ok-bg); color: var(--ok); font-size: 13px; font-weight: 600;
  }
  .waktu { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; background: var(--ok-bg); color: var(--ok); }
  .waktu.off { background: var(--bg); color: var(--muted); }
  .help { margin: 14px 0 0; text-align: center; font-size: 13px; color: var(--muted); }
  footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">BIM</div>
      <h1>Login Siswa</h1>
      <p class="sub">SMK Bina Insan Mandiri</p>
    </div>

    <form id="loginForm" novalidate>
      <label for="nis">NIS</label>
      <input id="nis" name="nis" type="text" inputmode="numeric" autocomplete="username" placeholder="Masukkan NIS" required>

      <label for="password">Password</label>
      <div class="field">
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
        <button type="button" class="toggle" id="toggle" aria-label="Tampilkan password">Lihat</button>
      </div>

      <div id="error" class="msg error" role="alert"></div>
      <button type="submit" class="btn">Masuk</button>
      <p class="help">Lupa password? Hubungi wali kelas atau admin sekolah.</p>
    </form>

    <section id="welcome" class="welcome">
      <h1 id="welcomeName" tabindex="-1"></h1>
      <span class="badge" id="welcomeClass"></span>
      <p class="sub" style="margin-top:14px">Login berhasil.</p>

      <p class="waktu off" id="waktuInfo" role="status"></p>
      <button type="button" class="btn" id="scanBtn">Scan QR Hadir</button>
      <div id="scanner" class="scanner">
        <div class="video-wrap">
          <video id="video" playsinline muted></video>
          <div class="frame"></div>
        </div>
        <p class="sub" id="scanStatus">Arahkan kamera ke QR code kehadiran.</p>
        <button type="button" class="btn secondary" id="torchBtn" style="display:none">Nyalakan senter</button>
        <button type="button" class="btn secondary" id="closeScan">Tutup kamera</button>
      </div>
      <div id="scanResult" class="msg" role="status"></div>

      <details class="manual">
        <summary>Kamera tidak mendeteksi? Input kode manual</summary>
        <div class="row">
          <input id="manualKode" type="text" aria-label="Kode kehadiran" placeholder="Ketik kode kehadiran" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button type="button" class="btn" id="manualBtn">Hadir</button>
        </div>
      </details>

      <div class="list-head">
        <h2 id="listTitle">Hadir hari ini</h2>
        <button type="button" class="link-btn" id="refreshList">Muat ulang</button>
      </div>
      <p class="count" id="listCount"></p>
      <ol class="hadir-list" id="hadirList"></ol>

      <button type="button" class="btn secondary" id="logout">Keluar</button>
    </section>

    <footer>&copy; SMK Bina Insan Mandiri</footer>
  </main>

<!-- TODO: tambahkan atribut integrity="sha384-..." (SRI) pada script di bawah -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  // Konfigurasi Supabase (anon key memang boleh ada di sisi klien)
  const SUPABASE_URL = "https://tldolhztnufvgbanigba.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsZG9saHp0bnVmdmdiYW5pZ2JhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NTc4NTksImV4cCI6MjEwODEzMzg1OX0.7nPP7tV8bhLZzlMcaSFrXWuyq4n72kTDSwcEyhc55LU";

  const form = document.getElementById("loginForm");
  const nisInput = document.getElementById("nis");
  const pwInput = document.getElementById("password");
  const errorBox = document.getElementById("error");
  const welcome = document.getElementById("welcome");
  const submitBtn = form.querySelector(".btn");
  let currentUser = null; // { nis, password } selama sesi login

  function showError(text) {
    errorBox.textContent = text;
    errorBox.classList.add("show");
  }

  document.getElementById("toggle").addEventListener("click", function () {
    const hidden = pwInput.type === "password";
    pwInput.type = hidden ? "text" : "password";
    pwInput.classList.toggle("pw-visible", hidden);
    this.textContent = hidden ? "Sembunyi" : "Lihat";
  });

  async function loginSiswa(nis, password) {
    const rows = await rpc("login_siswa", { p_nis: nis, p_password: password });
    return rows.length ? rows[0] : null;
  }

  // ===== Sesi tersimpan (tetap login setelah refresh) =====
  const SESI_KEY = "bim_sesi", SESI_MS = 12 * 60 * 60 * 1000;
  function saveSession(siswa, pw) {
    try {
      localStorage.setItem(SESI_KEY, JSON.stringify({ nis: siswa.nis, nama: siswa.nama, kelas: siswa.kelas, pw: pw, exp: Date.now() + SESI_MS }));
    } catch (e) { /* penyimpanan diblokir, sesi hanya berlaku di halaman ini */ }
  }
  function clearSaved() { try { localStorage.removeItem(SESI_KEY); } catch (e) {} }

  function enterApp(siswa, pw) {
    currentUser = { nis: siswa.nis, password: pw };
    document.getElementById("welcomeName").textContent = "Selamat datang, " + siswa.nama + "!";
    document.getElementById("welcomeClass").textContent = siswa.kelas ? "Kelas " + siswa.kelas : "NIS " + siswa.nis;
    form.style.display = "none";
    document.querySelector(".brand").style.display = "none";
    welcome.classList.add("show");
    document.getElementById("welcomeName").focus();
    updateWaktu();
    loadDaftar();
    startSession();
  }

  function restoreSession() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(SESI_KEY)); } catch (e) {}
    if (!saved || !saved.nis || !saved.pw || !(saved.exp > Date.now())) { clearSaved(); return; }
    enterApp({ nis: saved.nis, nama: saved.nama, kelas: saved.kelas }, saved.pw);
    loginSiswa(saved.nis, saved.pw).then(function (s) {
      if (!s && currentUser) doLogout("Sesi tidak valid. Silakan login ulang.");
    }).catch(function () { /* offline: biarkan tetap masuk */ });
  }

  // ===== Info waktu shalat (sama dengan aturan di server, zona Asia/Jakarta) =====
  function waktuSholat() {
    const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
    const h = parseInt(parts.find(function (p) { return p.type === "hour"; }).value, 10) % 24;
    const m = parseInt(parts.find(function (p) { return p.type === "minute"; }).value, 10);
    const t = h * 60 + m;
    if (t >= 360 && t < 660) return { nama: "Dhuha", jam: "06:00–11:00" };
    if (t >= 660 && t < 900) return { nama: "Zuhur", jam: "11:00–15:00" };
    if (t >= 900 && t < 1080) return { nama: "Ashar", jam: "15:00–18:00" };
    return null;
  }
  function updateWaktu() {
    const w = waktuSholat(), box = document.getElementById("waktuInfo");
    if (w) {
      box.textContent = "Sekarang waktu shalat " + w.nama + " (" + w.jam + " WIB). Scan QR akan dicatat sebagai shalat " + w.nama + ".";
      box.className = "waktu";
      scanBtn.textContent = "Scan QR Absen " + w.nama;
    } else {
      box.textContent = "Saat ini di luar waktu absen. Absen dibuka pukul 06:00–18:00 WIB (Dhuha, Zuhur, Ashar).";
      box.className = "waktu off";
      scanBtn.textContent = "Scan QR Hadir";
    }
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorBox.classList.remove("show");

    const nis = nisInput.value.trim();
    const pw = pwInput.value;
    if (!nis || !pw) { showError("NIS dan password wajib diisi."); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Memeriksa...";
    try {
      const siswa = await loginSiswa(nis, pw);
      if (!siswa) { showError("NIS atau password salah."); return; }

      enterApp(siswa, pw);
      saveSession(siswa, pw);

      // Untuk mengarahkan ke halaman lain setelah login, aktifkan baris ini:
      // window.location.href = "dashboard.html";
    } catch (err) {
      console.error(err);
      showError("Tidak dapat terhubung ke server. Coba lagi nanti.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Masuk";
    }
  });

  function doLogout(notice) {
    stopScan();
    endSession();
    clearSaved();
    currentUser = null;
    scanResult.className = "msg";
    document.getElementById("hadirList").textContent = "";
    document.getElementById("listCount").textContent = "";
    welcome.classList.remove("show");
    form.style.display = "";
    document.querySelector(".brand").style.display = "";
    form.reset();
    if (notice) showError(notice); else errorBox.classList.remove("show");
    nisInput.focus();
  }
  document.getElementById("logout").addEventListener("click", function () { doLogout(); });

  // Sesi: auto-logout bila tidak aktif + muat ulang daftar berkala
  const IDLE_MS = 60 * 60 * 1000, REFRESH_MS = 30 * 1000;
  const ACTIVITY = ["click", "keydown", "touchstart"];
  let idleTimer = null, refreshTimer = null;
  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { doLogout("Sesi berakhir karena tidak aktif. Silakan login ulang."); }, IDLE_MS);
  }
  function startSession() {
    resetIdle();
    ACTIVITY.forEach(function (ev) { document.addEventListener(ev, resetIdle, { passive: true }); });
    clearInterval(refreshTimer);
    refreshTimer = setInterval(function () { updateWaktu(); if (!document.hidden) loadDaftar(); }, REFRESH_MS);
  }
  function endSession() {
    clearTimeout(idleTimer);
    clearInterval(refreshTimer);
    ACTIVITY.forEach(function (ev) { document.removeEventListener(ev, resetIdle); });
  }

  // ===== Scan QR Hadir =====
  const scanBtn = document.getElementById("scanBtn");
  const manualBtn = document.getElementById("manualBtn");
  const torchBtn = document.getElementById("torchBtn");
  const scanner = document.getElementById("scanner");
  const scanStatus = document.getElementById("scanStatus");
  const scanResult = document.getElementById("scanResult");
  const video = document.getElementById("video");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const hasNative = "BarcodeDetector" in window;
  let detector = null;
  let stream = null;
  let scanning = false;
  let busy = false;

  function showResult(type, text) {
    scanResult.textContent = text;
    scanResult.className = "msg show " + type;
  }

  async function rpc(name, body) {
    const ctrl = new AbortController();
    const timer = setTimeout(function () { ctrl.abort(); }, 15000);
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        },
        body: JSON.stringify(body),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  async function startScan() {
    scanResult.className = "msg";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showResult("error", "Kamera tidak tersedia. Buka halaman lewat HTTPS atau localhost, atau pakai input kode manual.");
      return;
    }
    if (!hasNative && typeof jsQR === "undefined") {
      showResult("error", "Library pemindai gagal dimuat (cek koneksi internet). Pakai input kode manual.");
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (err) {
      showResult("error", "Kamera tidak bisa dibuka. Pastikan izin kamera diberikan.");
      return;
    }
    // Tampilkan area video DULU, baru diputar (video yang tersembunyi bisa tidak menghasilkan frame)
    scanBtn.style.display = "none";
    scanner.classList.add("show");
    scanStatus.textContent = "Memindai... arahkan kamera ke QR code.";
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* diabaikan, autoplay tetap jalan */ }
    if (hasNative && !detector) {
      try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { detector = null; }
    }
    setupTorch();
    scanning = true;
    busy = false;
    requestAnimationFrame(tick);
  }

  let torchOn = false;
  function setupTorch() {
    torchOn = false;
    torchBtn.textContent = "Nyalakan senter";
    const track = stream && stream.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    torchBtn.style.display = caps.torch ? "" : "none";
  }
  torchBtn.addEventListener("click", async function () {
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    try {
      await track.applyConstraints({ advanced: [{ torch: !torchOn }] });
      torchOn = !torchOn;
      torchBtn.textContent = torchOn ? "Matikan senter" : "Nyalakan senter";
    } catch (e) { /* senter tidak didukung */ }
  });

  function stopScan() {
    scanning = false;
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    video.srcObject = null;
    torchBtn.style.display = "none";
    scanner.classList.remove("show");
    scanBtn.style.display = "";
  }

  async function readFrame() {
    if (detector) {
      const found = await detector.detect(video);
      if (found.length && found[0].rawValue) return found[0].rawValue.trim();
      return null;
    }
    if (typeof jsQR === "undefined") return null;
    const scale = Math.min(1, 1000 / video.videoWidth);
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
    return code && code.data ? code.data.trim() : null;
  }

  async function tick() {
    if (!scanning) return;
    if (!busy && video.readyState >= 2 && video.videoWidth) {
      busy = true;
      try {
        const kode = await readFrame();
        if (kode && scanning) { handleCode(kode); return; }
      } catch (e) { /* frame gagal dibaca, coba lagi */ }
      busy = false;
    }
    requestAnimationFrame(tick);
  }

  let submitting = false;
  async function handleCode(kode) {
    if (submitting) return;
    submitting = true;
    manualBtn.disabled = true;
    stopScan();
    showResult("info", "Mencatat kehadiran...");
    try {
      const status = await rpc("catat_hadir", { p_nis: currentUser.nis, p_password: currentUser.password, p_kode: kode });
      const parts = String(status).split(":");
      const st = parts[0];
      const label = parts[1] ? " shalat " + parts[1] : "";
      if (st === "ok") { showResult("ok", "Kehadiran" + label + " berhasil dicatat. Terima kasih!"); if (navigator.vibrate) navigator.vibrate(200); }
      else if (st === "sudah") showResult("ok", "Kehadiran" + label + " hari ini sudah tercatat.");
      else if (st === "kode_salah") showResult("error", "QR code tidak valid.");
      else if (st === "diluar_waktu") showResult("error", "Di luar waktu absen. Absen dibuka untuk Dhuha, Zuhur, dan Ashar.");
      else if (st === "invalid") showResult("error", "Login tidak valid. Silakan login ulang.");
      else showResult("error", "Gagal mencatat kehadiran (kode server: " + (typeof status === "string" ? status : JSON.stringify(status)) + ").");
      loadDaftar();
    } catch (err) {
      console.error(err);
      showResult("error", "Tidak dapat terhubung ke server. Coba lagi.");
    } finally {
      submitting = false;
      manualBtn.disabled = false;
    }
  }

  // ===== Daftar hadir hari ini =====
  const listTitle = document.getElementById("listTitle");
  const listCount = document.getElementById("listCount");
  const hadirList = document.getElementById("hadirList");

  function renderList(rows) {
    hadirList.textContent = "";
    listCount.textContent = rows.length + " siswa hadir";
    if (!rows.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Belum ada yang hadir hari ini.";
      hadirList.appendChild(li);
      return;
    }
    rows.forEach(function (r) {
      const li = document.createElement("li");
      const nama = document.createElement("span");
      nama.textContent = r.nama;
      const meta = document.createElement("span");
      meta.className = "meta";
      const jam = new Date(r.waktu).toLocaleTimeString("id-ID", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit" });
      meta.textContent = (r.kelas ? r.kelas + " · " : "") + jam;
      li.appendChild(nama);
      li.appendChild(meta);
      hadirList.appendChild(li);
    });
  }

  async function loadDaftar() {
    if (!currentUser) return;
    listTitle.textContent = "Hadir hari ini, " + new Date().toLocaleDateString("id-ID", {
      timeZone: "Asia/Jakarta", weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    if (!hadirList.children.length) listCount.textContent = "Memuat daftar...";
    try {
      const rows = await rpc("daftar_hadir", { p_nis: currentUser.nis, p_password: currentUser.password });
      if (currentUser) renderList(rows);
    } catch (err) {
      console.error(err);
      listCount.textContent = "Gagal memuat daftar hadir.";
    }
  }

  scanBtn.addEventListener("click", startScan);
  document.getElementById("closeScan").addEventListener("click", stopScan);
  document.getElementById("refreshList").addEventListener("click", loadDaftar);
  document.getElementById("manualBtn").addEventListener("click", function () {
    const input = document.getElementById("manualKode");
    const kode = input.value.trim();
    if (!kode) { showResult("error", "Isi kode terlebih dahulu."); return; }
    input.value = "";
    handleCode(kode);
  });

  restoreSession();
</script>
</body>
</html>
